name: AAAI-UC Experiment Runner
on: workflow_dispatch
jobs:
  run-trials:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        model: [gemini-1.5-flash, llama3-8b-8192]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install google-generativeai groq requests pytest
      - name: Run experiment
        run: python run_experiment.py --model ${{ matrix.model }} --rpm 15 --tpm 10000 --rpd 1000 --out ${{ matrix.model }}_results.jsonl
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.model }}-${{ github.run_id }}
          path: ${{ matrix.model }}_results.jsonl
          retention-days: 14
