[package]
name = "sth"
version = "0.1.0"
edition = "2021"
description = "Stateful Terminal Harness: PTY-mediated action-observation loop for episteme-cli"

[[bin]]
name = "sth"
path = "src/main.rs"

[dependencies]
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
